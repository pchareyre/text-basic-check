[project]
name = "textaicheck"
version = "0.1.0"
description = "\"Advanced syntax correction, reformulation and translation through LLM\""
authors = [
    {name = "LARRANAGA ZUMETA, Maialen",email = "maialen.larranagazumeta@capgemini.com"}
]
license = {text = "n"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "spacy (==3.8.7)",
    "langchain-openai (>=1.1.0,<2.0.0)",
    "spacy-langdetect (>=0.1.2,<0.2.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]
